# Exchange_rate dataset (daily, D=8) - 24GB GPU preset
# ------------------------------------------------------
# MODEL LOCKED per user instruction: d=512×4, agg=256×2 (same for 8G)
# ------------------------------------------------------
# BS_physical = 32 (trivial D=8 so fill 24G with largest phys BS that keeps eff BS ≈ 64)
# accum_steps = 2
# BS_effective = 32 × 2 = 64
# ------------------------------------------------------

project:
  name: tacf_exchange_24g
  seed: 42
  device: cuda
  amp: true

data:
  dataset: exchange_rate
  root: preprocess
  seq_len: 336
  pred_len: 168
  label_len: 168
  batch_size: 32
  num_workers: 4
  pin_memory: true
  use_time_features: true

model:
  specialist:
    d_model: 512
    n_layers: 4
  aggregator:
    d_model: 256
    n_layers: 2

training:
  lr: 1.0e-3
  weight_decay: 1e-4
  grad_clip: 1.0
  warmup_epochs: 5
  grad_accum_steps: 2
  stage1_max_epochs: 40
  stage2_max_epochs: 15
  stage3_max_epochs: 15
  stage4_max_epochs: 30
  early_stop_stage1: 15
  early_stop_stage2: 6
  early_stop_stage3: 6
  early_stop_stage4: 8
  stage4_lr_mult: 0.03
  stage4_early_stop: 5

loss:
  lambda_nll: 2.0
  lambda_mse: 1.0
  lambda_consensus: 0.1
  lambda_reject: 0.01
  lambda_orthogonality: 0.01
  lambda_agent: 0.05
  lambda_cov_penalty: 0.25
  target_q: 0.95
  use_mixture_nll: false
