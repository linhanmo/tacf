# Electricity dataset (hourly, D=321 features) - 8GB GPU preset
# ------------------------------------------------------------------
# MODEL LOCKED per user instruction - d=384×3 specialist, agg=192×2, SAME as 24G.
# Only BS_physical × accum adapted for 8GB safety cap.
# ------------------------------------------------------------------
# BS_physical = 2
# accum_steps = 20
# BS_effective = 2 × 20 = 40  → identical effective batch to 24G preset.
# ------------------------------------------------------------------

project:
  name: tacf_electricity_8g
  seed: 42
  device: cuda
  amp: true

data:
  dataset: electricity
  root: preprocess
  seq_len: 336
  pred_len: 168
  label_len: 168
  batch_size: 2
  num_workers: 4
  pin_memory: true
  use_time_features: true

model:
  specialist:
    d_model: 384
    n_layers: 3
  aggregator:
    d_model: 192
    n_layers: 2

training:
  lr: 6.0e-4
  weight_decay: 1e-4
  grad_clip: 1.0
  warmup_epochs: 5
  grad_accum_steps: 20
  stage1_max_epochs: 40
  stage2_max_epochs: 15
  stage3_max_epochs: 15
  stage4_max_epochs: 30
  early_stop_stage1: 15
  early_stop_stage2: 6
  early_stop_stage3: 6
  early_stop_stage4: 8
  stage4_lr_mult: 0.03
  stage4_early_stop: 5

loss:
  lambda_nll: 2.0
  lambda_mse: 1.0
  lambda_consensus: 0.1
  lambda_reject: 0.01
  lambda_orthogonality: 0.01
  lambda_agent: 0.05
  lambda_cov_penalty: 0.25
  target_q: 0.95
  use_mixture_nll: false
