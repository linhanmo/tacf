# ETT Family (ETTh1/ETTh2/ETTm1/ETTm2) - 8GB GPU PRODUCTION preset.
# ---------------------------------------------------------------------
# MODEL ARCHITECTURE LOCKED - same as 24G preset per user instruction.
# Only physical batch and grad_accum are adapted for 8GB (safe cap = 7.2GB).
# ---------------------------------------------------------------------
# d_model   = 512   LOCKED (same as 24G)
# n_layers  = 4     LOCKED
# agg d_m   = 256   LOCKED
# agg n_l   = 2     LOCKED
# ---------------------------------------------------------------------
# BS_physical = 4    (peak activation VRAM ~(4/28)*12.76 = ~1.8GB AMP → massive headroom)
# accum_steps = 16
# BS_effective = 4 × 16 = 64   → SAME stable training dynamics as 24G preset.
# ---------------------------------------------------------------------

project:
  name: tacf_ett_8g
  seed: 42
  device: cuda
  amp: true

data:
  dataset: ETTh1
  root: preprocess
  seq_len: 336
  pred_len: 168
  label_len: 168
  batch_size: 4
  num_workers: 4
  pin_memory: true
  use_time_features: true

model:
  specialist:
    d_model: 512
    n_layers: 4
  aggregator:
    d_model: 256
    n_layers: 2

training:
  lr: 1.0e-3
  weight_decay: 1e-4
  grad_clip: 1.0
  warmup_epochs: 5
  grad_accum_steps: 16
  stage1_max_epochs: 40
  stage2_max_epochs: 15
  stage3_max_epochs: 15
  stage4_max_epochs: 30
  early_stop_stage1: 15
  early_stop_stage2: 6
  early_stop_stage3: 6
  early_stop_stage4: 8
  stage4_lr_mult: 0.03
  stage4_early_stop: 5

loss:
  lambda_nll: 2.0
  lambda_mse: 1.0
  lambda_consensus: 0.1
  lambda_reject: 0.01
  lambda_orthogonality: 0.01
  lambda_agent: 0.05
  lambda_cov_penalty: 0.25
  target_q: 0.95
  use_mixture_nll: false
